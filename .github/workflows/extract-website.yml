
name: Extract Website NESEMBA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          unzip -o nesemba-esports.zip -d .

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js admin pages assets
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan file."
          else
            git commit -m "Extract NESEMBA E-SPORTS website"
            git push
          fi
